name: Android APK
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'
      - name: Assemble installable debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Archive module
        run: |
          cd magisk-module
          zip -r ../OpenBoot-OneShot-Module-rev1.zip module.prop service.sh
      - uses: actions/upload-artifact@v4
        with:
          name: OpenBoot-Rev1-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: OpenBoot-OneShot-Module-rev1
          path: OpenBoot-OneShot-Module-rev1.zip
          if-no-files-found: error
